name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Config + asset tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run installer config/asset tests
        # These validate build.toml, the committed icon assets (Flatpak requires
        # assets/icon.png), the Flatpak runtime version, and Python alignment.
        run: python -m pytest
